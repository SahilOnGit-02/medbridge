services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: medbridge
      POSTGRES_USER: medbridge
      POSTGRES_PASSWORD: medbridge
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medbridge -d medbridge"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
